<!DOCTYPE html>
<!-- saved from url=(0049)file:///Users/carvy/repos/sign-up-form/index.html -->
<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>
    <link rel="stylesheet" href="./Sign Up Form_files/style.css">
</head>
<body>
    
    <div class="container">

        <div class="left-column">
            <div class="logo-banner">
                <img src="./Sign Up Form_files/odin-lined.png">
                <span>ODIN</span>
            </div>
            <p class="credit">Photo by Halie West on Unsplash</p>
        </div>

        <div class="right-column">
            <div class="introduction">
                <p>This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams.</p>
                <p>Sign up <em>now</em> to get started.</p>
                <p>You <em>know</em> you want to.</p>
            </div>

            <div class="form-container">
                <p class="form-title">Let's do this!</p>
                <form>

                    <div class="input-group">
                        <label for="first-name">FIRST NAME</label>
                        <input type="text" id="first-name" name="first-name" required="">
                    </div>

                    <div class="input-group">
                        <label for="last-name">LAST NAME</label>
                        <input type="text" id="last-name" name="last-name" required="">
                    </div>

                    <div class="input-group">
                        <label for="email">EMAIL</label>
                        <input type="email" id="email" name="email" required="">
                    </div>

                    <div class="input-group">
                        <label for="phone-number">PHONE NUMBER</label>
                        <input type="tel" id="phone-number" name="phone-number" required="">
                    </div>

                    <div class="input-group">
                        <label for="password">PASSWORD</label>
                        <input type="password" id="password" name="password" required="">
                    </div>
                    
                    <div class="input-group">
                        <label for="confirm-password">CONFIRM PASSWORD</label>
                        <input type="password" id="confirm-password" name="confirm-password required">
                    </div>
                
                </form>
            </div>

            <div class="submit-section">
                <button>Create Account</button>
                <p>Already have an account? <a>Log in</a></p>
            </div>
        </div>

    </div>


</body></html>
